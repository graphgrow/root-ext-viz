[project]
name = "root-ext-viz"
version = "0.5.0"
description = "Data-visualization MCP tool server: a sessional Python kernel (pandas/numpy/scipy/matplotlib/plotly/altair), Vega-Lite charts as source documents rendered locally by vl-convert, and engineering chart recipes. Compute and plot; outputs land only in derived or artifact directories."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    # Upper bound deliberate: MCP 2026-07-28 removes the `initialize`
    # handshake, so a 2.x SDK would break this server at connect with no
    # signal. Raise it only with a tested migration.
    "mcp>=1.9,<2",
    "pandas>=2.1",
    "numpy>=1.26",
    "scipy>=1.11",
    "matplotlib>=3.8",
    "plotly>=5.20",
    "altair>=5.3",
    "vl-convert-python>=1.6",
    "pyarrow>=15",
    "openpyxl>=3.1",
    "tabulate>=0.9",
]

[project.scripts]
root-ext-viz = "root_ext_viz.server:main"

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# SKILL.md is model-facing instruction the client extracts from the wheel
# at install (ADR-0025), so every build target must name it or it is
# silently dropped. Declared globally, NOT on the wheel target alone:
# `uv build` produces the sdist first and then builds the wheel FROM it,
# so a wheel-only rule loses it on that path — the same version shipping
# with or without its instructions depending on how it was built.
[tool.hatch.build]
artifacts = ["src/root_ext_viz/SKILL.md"]

[tool.hatch.build.targets.wheel]
packages = ["src/root_ext_viz"]

# The shipped wheel is compiled (ADR-0097, root-packs/tools/compile_wheel.py).
# `__init__` and the server module stay source on their own; these too:
[tool.root-pack.compile]
keep-source = [
    # Started as `python -m root_ext_viz._kernel_child`, and runpy cannot
    # run an extension module as __main__.
    "root_ext_viz._kernel_child",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
