[project]
name = "root-ext-viz"
version = "0.1.0"
description = "Data-visualization MCP tool server: a sessional Python kernel (pandas/numpy/scipy/matplotlib/plotly/altair), Vega-Lite charts as source documents rendered locally by vl-convert, and engineering chart recipes. Compute and plot; outputs land only in derived or artifact directories."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.9",
    "pandas>=2.1",
    "numpy>=1.26",
    "scipy>=1.11",
    "matplotlib>=3.8",
    "plotly>=5.20",
    "altair>=5.3",
    "vl-convert-python>=1.6",
    "pyarrow>=15",
    "openpyxl>=3.1",
    "tabulate>=0.9",
]

[project.scripts]
root-ext-viz = "root_ext_viz.server:main"

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/root_ext_viz"]

[tool.pytest.ini_options]
testpaths = ["tests"]
